<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131a"><meta name="description" content="Apple Corner World business app">
<link rel="manifest" href="manifest.webmanifest">
<title>Apple Corner World</title>
<style>
:root{--bg:#10131a;--panel:#1c2230;--panel2:#252d3e;--text:#f5f7fb;--muted:#aeb8c8;--green:#65d6a6;--line:#374154;--gold:#ffdc8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,Arial,sans-serif}header{padding:18px;background:linear-gradient(135deg,#23394a,#10131a);border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:15px;background:var(--green);color:#102019;display:grid;place-items:center;font-size:28px}h1{margin:0;color:var(--green);font-size:clamp(23px,5vw,32px)}header p{margin:3px 0 0;color:var(--muted)}nav{display:flex;gap:8px;padding:12px 14px;overflow:auto;background:#141923;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:30px;padding:10px 14px;font-weight:700}nav button.active{background:var(--green);color:#102019}main{max-width:1100px;margin:auto;padding:18px 14px 44px}.hero{padding:25px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#26394a,#1c2230);margin-bottom:18px}.hero h2{font-size:clamp(26px,6vw,40px);line-height:1.1;margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.card h3{margin:0 0 8px}.section-title{margin:25px 0 12px}.primary,.secondary,.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.primary,.btn{background:var(--green);color:#102019}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}label{display:block;margin:11px 0 5px;font-weight:700}input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #59657a;background:#111722;color:var(--text);font:inherit}textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.notice{padding:12px;border:1px solid #2c6552;border-radius:10px;background:#192d29;color:#b8f4dc;margin:12px 0}.warning{background:#332b1c;border-color:#66512b;color:var(--gold)}.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#303b4e;font-size:12px}.price{color:var(--green);font-size:20px;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.hidden{display:none!important}.stat{font-size:26px;font-weight:900;color:var(--green)}footer{text-align:center;color:var(--muted);border-top:1px solid var(--line);padding:20px}.small{font-size:13px}
</style></head>
<body>
<header><div class="wrap brand"><div class="logo">🍎</div><div><h1>Apple Corner World</h1><p>Phone sales • Repairs • Customer care</p></div></div></header>
<nav id="nav"><button class="active" data-page="home">Home</button><button data-page="products">Products</button><button data-page="repair">Book Repair</button><button data-page="track">Track Repair</button><button data-page="contact">Contact</button><button data-page="owner">Owner Dashboard</button></nav>
<main id="app"></main><footer>© <span id="year"></span> Apple Corner World</footer>
<script>
const PHONE="+231761415094", DEMO_PIN="2468";
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem("acw_"+k))??d}catch{return d}};
let products=load("products",[{id:1,name:"Smartphone",description:"Ask us about current models.",price:"",currency:"USD",stock:"Contact for availability"}]);
let repairs=load("repairs",[]), sales=load("sales",[]), expenses=load("expenses",[]), news=load("news",[]);
function save(){for(const [k,v] of Object.entries({products,repairs,sales,expenses,news}))localStorage.setItem("acw_"+k,JSON.stringify(v))}
const wa=t=>"https://wa.me/"+PHONE.replace(/\D/g,"")+"?text="+encodeURIComponent(t||"Hello Apple Corner World, I would like to ask about your services.");
function money(n,c){return new Intl.NumberFormat("en-US",{style:"currency",currency:c||"USD"}).format(Number(n)||0)}
function go(p){render(p);window.scrollTo({top:0,behavior:"smooth"})}
function home(){return `<section class="hero"><span class="pill">WELCOME</span><h2>Your phone. Our care.</h2><p class="muted">Welcome to Apple Corner World. Explore products, book a repair, track a repair request, or contact our team.</p><div class="actions"><a class="btn" href="${wa()}">WhatsApp us</a><a class="secondary" href="tel:${PHONE}">Call +231 761 415 094</a></div></section>${news.length?`<h2 class="section-title">Company Updates</h2><div class="grid">${news.map(n=>`<article class="card"><h3>${escapeHTML(n.title)}</h3><p>${escapeHTML(n.body)}</p><small class="muted">${escapeHTML(n.date)}</small></article>`).join("")}</div>`:""}<h2 class="section-title">How can we help?</h2><div class="grid"><div class="card"><h3>📱 Phone Sales</h3><p class="muted">Browse products and ask about current prices.</p><button class="primary" onclick="go('products')">Browse products</button></div><div class="card"><h3>🔧 Phone Repairs</h3><p class="muted">Send a repair request and save its reference.</p><button class="primary" onclick="go('repair')">Book repair</button></div><div class="card"><h3>📦 Repair Tracking</h3><p class="muted">Check the latest status for a request on this device.</p><button class="primary" onclick="go('track')">Track repair</button></div></div><div class="notice warning"><strong>Prototype notice:</strong> This demo stores data only in this browser on this device. It is not yet connected to a secure online database, so customer requests will not automatically reach the owner.</div>`}
function productPage(){return `<h2>Products & Accessories</h2><p class="muted">Prices and availability should be confirmed with our team.</p><div class="grid">${products.map(p=>`<article class="card"><h3>📱 ${escapeHTML(p.name)}</h3><p>${escapeHTML(p.description)}</p><div class="price">${p.price?money(p.price,p.currency):"Ask for price"}</div><p><span class="pill">${escapeHTML(p.stock||"Contact for availability")}</span></p><a class="btn" href="${wa("Hello, I am interested in "+p.name+". Please confirm price and availability.")}">Ask on WhatsApp</a></article>`).join("")||"<p>No products listed yet. Please contact us.</p>"}</div>`}
function repairPage(){return `<div class="card"><h2>Book a Phone Repair</h2><form id="repairForm"><div class="formgrid"><div><label>Name *</label><input id="rn" required maxlength="100"></div><div><label>Phone number *</label><input id="rp" type="tel" required maxlength="30"></div><div><label>Phone make/model *</label><input id="rd" required maxlength="100"></div><div><label>Problem *</label><select id="ri" required><option value="">Choose</option><option>Screen damage</option><option>Battery/charging</option><option>Software</option><option>Water damage</option><option>Speaker/microphone</option><option>Other</option></select></div></div><label>Details (never include PINs/passwords)</label><textarea id="rx" maxlength="1000"></textarea><button class="primary">Submit repair request</button></form><div id="repairOut"></div></div>`}
function trackPage(){return `<div class="card"><h2>Track Repair</h2><form id="trackForm"><label>Repair reference</label><input id="tr" required placeholder="ACW-ABC123"><label>Phone number used when booking</label><input id="tp" type="tel" required><button class="primary">Check status</button></form><div id="trackOut"></div></div>`}
function contactPage(){return `<section class="hero"><h2>Contact Apple Corner World</h2><p class="muted">We are here to help with phones, accessories, and repairs.</p><div class="actions"><a class="btn" href="tel:${PHONE}">📞 Call us</a><a class="btn" href="${wa()}">🟢 WhatsApp</a></div></section><div class="card"><h3>Board of Directors</h3><p class="muted">Board information will be added later.</p><h3>Company email</h3><p class="muted">Email not displayed yet; please confirm the correct address before publishing.</p></div>`}
function ownerPage(){return `<div class="card"><h2>Private Owner Dashboard (demo)</h2><div class="notice warning"><strong>Not secure for public use:</strong> Demo code and data are stored in the page/browser. Before launch, replace this with server-side owner authentication and an online database.</div><form id="loginForm"><label>Demo access code</label><input id="pin" type="password" required><button class="primary">Open dashboard</button></form><p class="small muted">Prototype code: 2468. Do not use this as a real password.</p><div id="ownerContent"></div></div>`}
function render(p){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("app").innerHTML=({home,products:productPage,repair:repairPage,track:trackPage,contact:contactPage,owner:ownerPage}[p]||home)();if(p==="repair")$("repairForm").onsubmit=submitRepair;if(p==="track")$("trackForm").onsubmit=trackRepair;if(p==="owner")$("loginForm").onsubmit=loginOwner}
$("nav").onclick=e=>{let b=e.target.closest("[data-page]");if(b)go(b.dataset.page)};$("year").textContent=new Date().getFullYear();
function submitRepair(e){e.preventDefault();let r={id:"ACW-"+Math.random().toString(36).slice(2,8).toUpperCase(),name:$("rn").value.trim(),phone:$("rp").value.trim(),device:$("rd").value.trim(),issue:$("ri").value,details:$("rx").value.trim(),status:"Request received",date:new Date().toLocaleDateString()};repairs.unshift(r);save();$("repairOut").innerHTML=`<div class="notice">Demo request saved on this device. Your reference is <strong>${r.id}</strong>. Save it to check status here. <p><a class="btn" href="${wa("My repair reference is "+r.id+". Please contact me about my repair.")}">Send reference to WhatsApp</a></p></div>`;e.target.reset()}
function trackRepair(e){e.preventDefault();let r=repairs.find(x=>x.id===$("tr").value.trim().toUpperCase()&&x.phone===$("tp").value.trim());$("trackOut").innerHTML=r?`<div class="notice"><strong>${escapeHTML(r.id)}</strong><br>Device: ${escapeHTML(r.device)}<br>Status: <b>${escapeHTML(r.status)}</b><br>Date: ${escapeHTML(r.date)}</div>`:`<div class="notice warning">No matching request on this device. Records do not sync across devices in this prototype.</div>`}
function loginOwner(e){e.preventDefault();if($("pin").value!==DEMO_PIN){$("ownerContent").innerHTML="<p>Incorrect demo code.</p>";return}drawDashboard()}
function drawDashboard(){let revenue=sales.reduce((a,s)=>a+Number(s.amount||0),0), costs=expenses.reduce((a,s)=>a+Number(s.amount||0),0);$("ownerContent").innerHTML=`<h2>Business overview</h2><div class="grid"><div class="card"><div class="muted">Products</div><div class="stat">${products.length}</div></div><div class="card"><div class="muted">Repair requests</div><div class="stat">${repairs.length}</div></div><div class="card"><div class="muted">Recorded sales (mixed currencies)</div><div class="stat">${sales.length}</div></div><div class="card"><div class="muted">Recorded expenses</div><div class="stat">${expenses.length}</div></div></div>
<h3>Add/update products</h3><form id="pf"><label>Product name</label><input id="pn" required><label>Description</label><input id="pd"><div class="formgrid"><div><label>Price</label><input id="pp" type="number" min="0" step=".01"></div><div><label>Currency</label><select id="pc"><option>USD</option><option>LRD</option></select></div></div><label>Stock note</label><input id="ps" placeholder="In stock / ask us"><button class="primary">Add product</button></form><h3>Current products</h3>${products.map((p,i)=>`<div class="row"><div><b>${escapeHTML(p.name)}</b><div class="small muted">${p.price?money(p.price,p.currency):"Ask for price"} • ${escapeHTML(p.stock)}</div></div><button class="secondary" onclick="deleteProduct(${i})">Delete</button></div>`).join("")}
<h3>Repair requests & status</h3>${repairs.map((r,i)=>`<div class="card"><b>${escapeHTML(r.id)}</b> — ${escapeHTML(r.device)}<p class="small muted">${escapeHTML(r.name)} • ${escapeHTML(r.phone)} • ${escapeHTML(r.issue)}</p><label>Status</label><select id="status${i}">${["Request received","Inspection in progress","Waiting for parts","Repair in progress","Ready for collection","Completed","Cancelled"].map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select><button class="secondary" onclick="updateStatus(${i})">Save status</button></div>`).join("")||"<p class='muted'>No requests saved in this browser.</p>"}
<h3>Record a sale</h3><form id="sf"><div class="formgrid"><div><label>Item / service</label><input id="si" required></div><div><label>Amount</label><input id="sa" type="number" min=".01" step=".01" required></div><div><label>Currency</label><select id="sc"><option>USD</option><option>LRD</option></select></div></div><label>Note (optional)</label><input id="sn"><button class="primary">Record sale</button></form><h3>Sales records</h3>${sales.map(s=>`<div class="row"><div><b>${escapeHTML(s.item)}</b><div class="small muted">${escapeHTML(s.date)} ${escapeHTML(s.note)}</div></div><b>${money(s.amount,s.currency)}</b></div>`).join("")||"<p class='muted'>No sales recorded.</p>"}
<h3>Record an expense</h3><form id="ef"><div class="formgrid"><div><label>Expense</label><input id="ei" required></div><div><label>Amount</label><input id="ea" type="number" min=".01" step=".01" required></div><div><label>Currency</label><select id="ec"><option>USD</option><option>LRD</option></select></div></div><button class="primary">Record expense</button></form><h3>Expenses</h3>${expenses.map(s=>`<div class="row"><span>${escapeHTML(s.item)} <small class="muted">${escapeHTML(s.date)}</small></span><b>${money(s.amount,s.currency)}</b></div>`).join("")||"<p class='muted'>No expenses recorded.</p>"}
<h3>Company announcement</h3><form id="nf"><label>Announcement title</label><input id="nt" required><label>Message</label><textarea id="nb" required></textarea><button class="primary">Publish on home page</button></form>${news.map((n,i)=>`<div class="row"><div><b>${escapeHTML(n.title)}</b><div class="small muted">${escapeHTML(n.body)}</div></div><button class="secondary" onclick="deleteNews(${i})">Delete</button></div>`).join("")}
<h3>Export records</h3><p class="muted small">Download a backup of records stored in this browser.</p><button class="secondary" onclick="exportData()">Export JSON backup</button><div class="notice warning">Sales totals are not combined across LRD and USD because they are different currencies. This demo does not process payments.</div>`;
$("pf").onsubmit=e=>{e.preventDefault();products.push({id:Date.now(),name:$("pn").value.trim(),description:$("pd").value.trim(),price:$("pp").value,currency:$("pc").value,stock:$("ps").value.trim()||"Ask for availability"});save();drawDashboard()};
$("sf").onsubmit=e=>{e.preventDefault();sales.unshift({item:$("si").value.trim(),amount:$("sa").value,currency:$("sc").value,note:$("sn").value.trim(),date:new Date().toLocaleDateString()});save();drawDashboard()};
$("ef").onsubmit=e=>{e.preventDefault();expenses.unshift({item:$("ei").value.trim(),amount:$("ea").value,currency:$("ec").value,date:new Date().toLocaleDateString()});save();drawDashboard()};
$("nf").onsubmit=e=>{e.preventDefault();news.unshift({title:$("nt").value.trim(),body:$("nb").value.trim(),date:new Date().toLocaleDateString()});save();drawDashboard()};
}
function deleteProduct(i){products.splice(i,1);save();drawDashboard()}function deleteNews(i){news.splice(i,1);save();drawDashboard()}
function updateStatus(i){repairs[i].status=$("status"+i).value;save();alert("Status updated in this browser. It will not notify the customer automatically.");drawDashboard()}
function exportData(){let blob=new Blob([JSON.stringify({products,repairs,sales,expenses,news},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="apple-corner-world-backup.json";a.click();URL.revokeObjectURL(a.href)}
render("home");
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
